name: Recover Hypemanic (runner)
on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-22.04
    name: Headless full recovery
    steps:
      - name: Checkout gdsdecomp (standalone project)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout game PCK
        uses: actions/checkout@v4
        with:
          ref: game-hypemanic
          path: game
          fetch-depth: 1

      - name: Download prebuilt Linux editor
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: hazn75206-sketch/gdsdecomp
          run_id: 37431567591
          name: GDRE_tools-editor-linux-arm
          path: bin

      - name: Make executable + show version
        shell: bash
        run: |
          chmod +x bin/godot*
          ls -lh bin/
          ./bin/godot.linuxbsd.editor.x86_64 --headless --godot-version

      - name: Full recovery
        shell: bash
        run: |
          mkdir -p recovered
          stdbuf -o0 -e0 ./bin/godot.linuxbsd.editor.x86_64 --headless --path=standalone --recover=game/HypemanicHypermania2.pck --output=recovered/ 2>&1 | tee recovery.log
          echo "---OUTPUT---"
          du -sh recovered/
          find recovered/ -type f | head -20
          find recovered/ -type f | wc -l

      - name: Zip result
        shell: bash
        run: |
          zip -qr hypemanic-recovered.zip recovered/
          ls -lh hypemanic-recovered.zip

      - uses: actions/upload-artifact@v4
        with:
          name: hypemanic-recovered
          path: |
            hypemanic-recovered.zip
            recovery.log
          retention-days: 90

      - name: Publish release (direct zip link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: game-hypemanic-recovered
          name: HypemanicHypermania2 Recovered
          files: |
            hypemanic-recovered.zip
            recovery.log
